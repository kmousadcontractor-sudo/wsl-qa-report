<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Local retry worker: exact time versus +1ms" viewBox="0 0 640 650"><title>Local retry worker: exact time versus +1ms</title><rect width="640" height="650" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#496679"/></marker></defs><text x="320" y="31" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#142b3d">Local retry worker: exact time versus +1ms</text><rect x="80" y="55" width="480" height="76" rx="9" fill="#eaf4fc" stroke="#286284" stroke-width="2"/><text x="320" y="89" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">First payment fails at T0</text><path d="M320 131 L320 155" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="160" width="480" height="76" rx="9" fill="#eaf4fc" stroke="#286284" stroke-width="2"/><text x="320" y="194" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">First automatic retry sent at T0 + 24 hours</text><path d="M320 236 L165 270" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 236 L475 270" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="275" width="280" height="76" rx="9" fill="#eaf4fc" stroke="#286284" stroke-width="2"/><text x="165" y="298.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">Retry failure processed</text><text x="165" y="319.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">at exactly 24h</text><rect x="335" y="275" width="280" height="76" rx="9" fill="#eaf4fc" stroke="#286284" stroke-width="2"/><text x="475" y="298.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">Retry failure processed</text><text x="475" y="319.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">at 24h + 1ms</text><path d="M165 351 L165 375" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 351 L475 375" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="380" width="280" height="76" rx="9" fill="#fff0ee" stroke="#ad3932" stroke-width="2"/><text x="165" y="403.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">BUG: selects the used 24h</text><text x="165" y="424.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">slot again</text><rect x="335" y="380" width="280" height="76" rx="9" fill="#edf8f0" stroke="#267344" stroke-width="2"/><text x="475" y="414" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">Correct: next slot is 72h</text><path d="M165 456 L165 480" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 456 L475 480" fill="none" stroke="#496679" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="485" width="280" height="76" rx="9" fill="#fff0ee" stroke="#ad3932" stroke-width="2"/><text x="165" y="508.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">Next worker tick sends a</text><text x="165" y="529.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">second execute command</text><rect x="335" y="485" width="280" height="76" rx="9" fill="#edf8f0" stroke="#267344" stroke-width="2"/><text x="475" y="508.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">No extra execute at that</text><text x="475" y="529.5" text-anchor="middle" fill="#142b3d" font-family="Segoe UI,Arial,sans-serif" font-size="16">tick</text><text x="320" y="604" text-anchor="middle" font-size="15" font-family="Segoe UI,Arial,sans-serif" fill="#52616c">Injected local clock. No provider capture demonstrated.</text></svg>